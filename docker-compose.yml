services:

  db:
    image: postgres:15
    container_name: medical_db
    environment:
      POSTGRES_DB: medical_diagnostics
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: medical_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    container_name: medical_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
